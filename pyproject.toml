[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-auto"
version = "0.3.0"
description = "Deterministic Sol/Luna orchestration for ChatGPT App or OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
api = [
  "openai>=1.68,<3",
]
dev = [
  "mypy>=1.14,<2",
  "openai>=1.68,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
codex-auto = "codex_auto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_auto"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codex_auto"]
